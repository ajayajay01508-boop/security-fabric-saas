apiVersion: v1
kind: Namespace
metadata:
  name: security-fabric
  labels:
    istio-injection: enabled
---
# ServiceAccounts for Istio workload identity
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: security-fabric
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-detection-engine
  namespace: security-fabric
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-worker
  namespace: security-fabric
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: voice-alert-service
  namespace: security-fabric
---
# Secret template (values injected by CI/CD or external-secrets operator)
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secrets
  namespace: security-fabric
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://fabric:CHANGE_ME@rds-endpoint:5432/security_fabric"
  REDIS_URL: "redis://redis-master:6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-headless:9092"
  JWT_SECRET_KEY: "CHANGE_ME_TO_LONG_RANDOM_SECRET"
  STRIPE_SECRET_KEY: "sk_live_CHANGE_ME"
  STRIPE_WEBHOOK_SECRET: "whsec_CHANGE_ME"
