apiVersion: v1
kind: ConfigMap
metadata:
  name: security-fabric-config
  namespace: security-fabric
data:
  # API Gateway
  ENVIRONMENT: "production"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRE_MINUTES: "60"
  CORS_ORIGINS: '["https://app.security-fabric.io"]'

  # Kafka topics
  KAFKA_TOPIC_TELEMETRY: "raw-telemetry"
  KAFKA_TOPIC_THREATS: "threat-events"
  KAFKA_TOPIC_ALERTS: "alert-notifications"
  KAFKA_TOPIC_VOICE: "voice-alerts"

  # Consumer groups
  KAFKA_CONSUMER_GROUP_AI: "ai-detection"
  KAFKA_CONSUMER_GROUP_NOTIF: "notification-worker"
  KAFKA_CONSUMER_GROUP_VOICE: "voice-alert"

  # ML model
  MODEL_PATH: "models/detector.pkl"

  # Notification
  SMTP_FROM: "alerts@security-fabric.io"
  SMTP_PORT: "587"

  # Feature flags
  ENABLE_VOICE_ALERTS: "true"
  ENABLE_EMAIL_ALERTS: "true"
  ENABLE_PUSH_ALERTS: "false"
  MAX_BATCH_SIZE: "1000"
  ALERT_RETENTION_DAYS: "90"
