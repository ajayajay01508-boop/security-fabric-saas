# Default deny-all ingress and egress for the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: security-fabric
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# API Gateway: accept ingress from NGINX, allow egress to postgres/redis/kafka
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway-policy
  namespace: security-fabric
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app: dashboard-ui
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
---
# AI Detection Engine: only talks to Kafka and Redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-detection-engine-policy
  namespace: security-fabric
spec:
  podSelector:
    matchLabels:
      app: ai-detection-engine
  policyTypes:
    - Ingress
    - Egress
  ingress: []  # no ingress needed
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to: []
      ports:
        - protocol: UDP
          port: 53
---
# Dashboard UI: only serves HTTP, no internal egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard-ui-policy
  namespace: security-fabric
spec:
  podSelector:
    matchLabels:
      app: dashboard-ui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
  egress:
    - to: []
      ports:
        - protocol: UDP
          port: 53
