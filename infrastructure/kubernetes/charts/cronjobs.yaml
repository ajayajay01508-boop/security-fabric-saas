# ─── PostgreSQL Backup CronJob ────────────────────────────────
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: security-fabric
spec:
  schedule: "0 2 * * *"          # Every day at 02:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:16-alpine
              command:
                - /bin/sh
                - -c
                - |
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="/backups/security_fabric_${TIMESTAMP}.sql.gz"
                  echo "Starting backup: ${BACKUP_FILE}"
                  pg_dump $DATABASE_URL | gzip > "${BACKUP_FILE}"
                  echo "Backup complete: $(ls -lh ${BACKUP_FILE} | awk '{print $5}')"
                  # Prune backups older than 30 days
                  find /backups -name "*.sql.gz" -mtime +30 -delete
                  echo "Old backups pruned."
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: api-gateway-secrets
                      key: DATABASE_URL
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: backup-pvc
---
# ─── Alert Cleanup CronJob ────────────────────────────────────
apiVersion: batch/v1
kind: CronJob
metadata:
  name: alert-cleanup
  namespace: security-fabric
spec:
  schedule: "30 3 * * 0"         # Every Sunday at 03:30 UTC
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: python:3.11-slim
              command:
                - python
                - -c
                - |
                  import asyncio
                  import os
                  from datetime import datetime, timedelta, timezone

                  async def cleanup():
                      import asyncpg
                      conn = await asyncpg.connect(os.environ["DATABASE_URL"].replace("+asyncpg", ""))
                      cutoff = datetime.now(timezone.utc) - timedelta(days=90)
                      deleted = await conn.execute(
                          "DELETE FROM alerts WHERE status = 'resolved' AND created_at < $1", cutoff
                      )
                      print(f"Deleted old resolved alerts: {deleted}")
                      await conn.close()

                  asyncio.run(cleanup())
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: api-gateway-secrets
                      key: DATABASE_URL
---
# ─── Backup PVC ───────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-pvc
  namespace: security-fabric
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: gp3
