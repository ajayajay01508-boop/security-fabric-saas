[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git", "__pycache__", ".venv", "node_modules",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "S",    # bandit security
    "N",    # pep8 naming
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # FastAPI Depends() in function defaults
    "S101",   # assert statements (used in tests)
    "S105",   # hardcoded passwords (test fixtures)
    "S106",   # hardcoded passwords (test fixtures)
    "N803",   # argument name should be lowercase
    "UP007",  # Use X | Y for type hints (Python 3.10+)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N"]
"seed.py"  = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["app", "shared"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true
warn_return_any = false
files = ["apps/api-gateway/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/alembic/*",
    "*/train_model.py",
    "scripts/cloud-failover.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
